name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  APP_NAME: p2p-node

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: ls -la target/release/ | head -5
      - run: install -D target/release/$APP_NAME $APP_NAME-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-linux-x86_64
          path: ${{ env.APP_NAME }}-linux-x86_64

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: ARCH=$(uname -m) && install target/release/$APP_NAME $APP_NAME-macos-$ARCH
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macos
          path: ${{ env.APP_NAME }}-macos-*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: dir target\release\*.exe
        shell: pwsh
      - run: cmd /c "copy target\release\%APP_NAME%.exe %APP_NAME%-windows-x86_64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows-x86_64
          path: ${{ env.APP_NAME }}-windows-x86_64.exe

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: version
        run: echo "version=v$(grep '^version' Cargo.toml | head -1 | cut -d'\"' -f2)" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Organize
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: |
            Automated multi-platform build for ${{ steps.version.outputs.version }}
          files: release/*
          generate_release_notes: true
