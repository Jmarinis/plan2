name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-latest
            label: macos-x86_64
          - os: windows-latest
            label: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Rename binary with platform label
        shell: bash
        run: |
          EXT=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then EXT=".exe"; fi
          BINARY="target/release/p2p_node${EXT}"
          if [ -f "$BINARY" ]; then
            cp "$BINARY" "target/release/p2p-node-${{ matrix.label }}"
          fi
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: p2p-node-${{ matrix.label }}
          path: target/release/p2p-node-${{ matrix.label }}

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: version
        run: |
          VERSION="v$(grep '^version ' Cargo.toml | sed 's/.*"\(.*\)"/\1/')"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Prepare release artifacts
        run: |
          mkdir -p release_artifacts
          for dir in p2p-node-*; do
            if [ -d "$dir" ]; then
              find "$dir" -type f -exec cp {} release_artifacts/ \;
            fi
          done
          ls -la release_artifacts/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: |
            Automated release for ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: true
          files: release_artifacts/*
