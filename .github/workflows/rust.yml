name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  APP_NAME: p2p-node

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Determine label and ext
        shell: bash
        run: |
          ARCH=$(uname -m)
          case "${{ matrix.os }}" in
            ubuntu-latest) echo "label=linux-$ARCH" >> $GITHUB_OUTPUT; echo "ext=" >> $GITHUB_OUTPUT ;;
            macos-latest) echo "label=macos-$ARCH" >> $GITHUB_OUTPUT; echo "ext=" >> $GITHUB_OUTPUT ;;
            windows-latest) echo "label=windows-$ARCH" >> $GITHUB_OUTPUT; echo "ext=.exe" >> $GITHUB_OUTPUT ;;
          esac
        id: platform

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/${{ env.APP_NAME }}${{ steps.platform.outputs.ext }} dist/${{ env.APP_NAME }}-${{ steps.platform.outputs.label }}${{ steps.platform.outputs.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ steps.platform.outputs.label }}
          path: dist/*
          retention-days: 1

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=v$(grep '^version' Cargo.toml | head -1 | cut -d'\"' -f2)" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize binaries
        run: |
          mkdir -p release
          find artifacts -type f -name "${{ env.APP_NAME }}-*" -exec cp {} release/ \;
          ls -la release/

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: |
            Automated multi-platform build for ${{ steps.version.outputs.version }}
          files: release/*
          generate_release_notes: true
