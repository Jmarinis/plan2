name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  APP_NAME: p2p-node

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            label: linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
            label: macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            label: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            label: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (aarch64-apple-darwin)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          rustup toolchain install stable --target aarch64-apple-darwin

      - name: Install Rust (other)
        if: matrix.target != 'aarch64-apple-darwin'
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ env.APP_NAME }}${{ matrix.ext }} dist/${{ env.APP_NAME }}-${{ matrix.label }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.label }}
          path: dist/*
          retention-days: 1

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=v$(grep '^version' Cargo.toml | head -1 | cut -d'\"' -f2)" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize binaries
        run: |
          mkdir -p release
          find artifacts -type f -name "${{ env.APP_NAME }}-*" -exec cp {} release/ \;
          ls -la release/

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: |
            Automated multi-platform build for ${{ steps.version.outputs.version }}

            **Platforms:**
            - `linux-amd64` — Linux (x86_64)
            - `macos-amd64` — macOS (Intel)
            - `macos-arm64` — macOS (Apple Silicon)
            - `windows-amd64` — Windows (x86_64)

            Download the binary for your platform and restart.
          files: release/*
          generate_release_notes: true
